defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

seed: 0
use_single_vm_among_multiple: false
multihost_batch_sharding: false # assemble host-local NumPy batches into global JAX arrays
ds_path: null
tokens_params_ratio: 20 # chinchilla scaling
num_tokens_train: null
log_every_tokens: 1_000_000
log_metrics_per_step: True
log_metrics_per_step_full: false
log_effective_lr_every_steps: -1 # disabled; set to a positive interval to enable
log_output_embedding_group_metrics: true
eval_every_steps: 100
num_tokens_valid: 20_000_000
wandb_project: 'picodo-loss-spikes'
wandb_mode: 'disabled'
run_name: null
num_tp_devices: 1 # optional tensor parallelism
log_logit_grad_stats: false
log_logit_grad_scaling_stats: false
log_lm_head_diagnostic_metrics: false # mean output embedding, normalized max logit, and CE probability residual
log_parameter_update_metrics: false # exact Frobenius/output effects + approximate spectral ratios on heavy logs
log_head_scale_metrics: false # final-norm/LM-head activation and weight scale relationships on heavy logs
log_final_norm_channel_metrics: false # gamma magnitude and normalized channel-energy concentration on heavy logs
log_high_confidence_error_metrics: false # high-confidence errors and top-gamma logit-gap attribution on heavy logs
log_final_norm_activation_grad_metrics: false # dL/dx norms immediately before/after out_ln on heavy logs
skip_bad_batch: false
skip_bad_batch_metric: relative_jump
skip_bad_batch_relative_threshold: 0.5
skip_bad_batch_window: 1000
skip_bad_batch_z_threshold: 7.0
revert_idx: -1

model:
  D: null # model/embed/qkv dim
  L: null # num. block layers
  H: 128 # head dimension
  F: ${mul:4, ${model.D}} # FF inner dimension = 4 x embed dim.
  N: ${floordiv:${model.D}, ${model.H}} # num. attention heads
  T: null # context/sequence length
  V: null # vocab size -> must match dataset tokenizer!
  activ_dtype: 'bfloat16'
  lm_head_input_grad_fp32: false # compute only the LM-head input-gradient matmul in FP32
  data_param_sharding: true # shard parameters over data (FSDP-like); false = replicated-parameter DP
  use_flash_attn: true
  use_qk_norm: true
  rmsnorm_use_scale: false
  qk_norm_disable_scale: false # remove scale parameters only from query/key RMSNorms
  out_ln_use_scale: null # null inherits rmsnorm_use_scale; false disables scale only on final out_ln
  elementwise_attn_output_gate: false
  final_hidden_mean_centering: false
  alpha: 1.0
  # use_qk_norm: [0, 1, 2, 3, 4, 9, 10, 11]
  # Match Lingua's Megatron path: N(0, 0.01) input projections and
  # N(0, 0.01 / sqrt(2 * L)) residual output projections.
  megatron_init: false
  init_base_std: 0.01
  
opt:
  batch_size: 256
  peak_lr: 0.15
  warmup_frac: 0.05
  lr_schedule:
    exponent: 1.0 # exponent applied to the cosine decay curve
    end_value: 0.0 # absolute learning rate at the end of training
  b1: 0.9
  b2: 0.95
  b2_cosine_anneal:
    enabled: false
    final_b2: 0.95
  out_ln_scale_sgd:
    enabled: false # if true, optimize only out_ln.scale with momentum SGD instead of AdamW
    momentum: 0.9
    nesterov: false
  all_rmsnorm_scales_sgd:
    enabled: false # if true, optimize every RMSNorm scale with momentum SGD instead of AdamW
    momentum: 0.9
    nesterov: false
  weight_decay: 1e-4
  adamc:
    enabled: false # LR-correct weight decay on transformer linear layers; LM head remains regular AdamW
  exclude_input_embedding_weight_decay: false
  lm_head_optimizer:
    type: adamw # one of: adamw, sgd_momentum, adamw_b1, row_oblique, column_oblique
    peak_lr: ${opt.peak_lr} # optional LM-head-specific peak LR; defaults to the global optimizer peak LR
    momentum: 0.9 # used by sgd_momentum, row_oblique, and column_oblique
    nesterov: false # used by sgd_momentum
    b1: 0.9 # used by adamw_b1: per-LM-head first-moment decay (defaults to opt.b1 if absent)
    target_rms: 1.0 # used by row_oblique/column_oblique: target norm on the notebook's scaled oblique manifold
    direction_target_rms: 1.0 # used by row_oblique/column_oblique: RMS of the tangent-space update direction
    target_rms_from_random_init: false # if true, initialize the fixed oblique target_rms from the random LM-head's average per-row RMS before oblique renormalization
    learn_target_rms: false # if true, learn a positive scalar multiplier on top of the unit oblique LM head
    initial_target_rms: ${opt.lm_head_optimizer.target_rms} # initial value for the learned target rms scalar
    initial_target_rms_from_random_init: false # if true, initialize the learned scalar from the random LM-head's average per-row RMS before oblique renormalization
    eps: ${opt.eps} # used by row_oblique/column_oblique retraction/normalization
  lm_head_gradient_centering: 'off' # one of: off, pre, post
  lm_head_weighted_columnwise_gradient_centering: 'off' # one of: off, pre, post
  lm_head_mean_amplification:
    enabled: false
    start_step: 0 # zero-based optimizer step; amplification is applied after this step's update
    coefficient: 1.0 # E <- E + coefficient * mean_vocab(E)
  lm_head_adaptive_tuc:
    enabled: false
    lambda_scale: 0.05
    eps: ${opt.eps}
  clip_by_global_norm: 1.0
  use_z_loss: false
  eps: 1e-8
  loss_skip:
    enabled: false
    warmup_steps: 1000
    window_size: 1000
    min_history: 256
    z_soft: 5.0
    z_hard: 8.0
    soft_weight: 1.0
    eps: 1e-6
    use_log_loss: false
    abs_hard: null
  loss_cap:
    enabled: false
    soft_cap: 30.0
    warmup_steps: 0
  loss_rewrite:
    enabled: false
    replacement_token_id: 11
    warmup_steps: 1000
    window_size: 1000
    min_history: 256
    z_hard: 8.0
    eps: 1e-6
    use_log_loss: false

checkpoint:
  turn_on: true
  workdir: ""
  gcp_bucket: null
  load_path: null
  step_prefix: null
  checkpoint_every_steps: 2000
  max_to_keep: 100
  start_step: null # pick a specific checkpoint to start off from
  checkpoint_steps: null

diagnostics:
  end_step: null # to specific end step
  save_raw_losses: false
  collect_qkv_stats: false
  spike_analysis_top_k: 15
  spike_analysis_min_count: 5

profiling:
  enabled: false
  start_step: 5 # start after compilation/warmup steps
  num_steps: 10
  log_dir: "" # defaults to $PICODO_PROFILE_LOG_DIR or ./jax-profile
  create_perfetto_trace: true
